description = "One task in three turns: edits a.txt, then 「continue」 edits it again, then 「ok」 adds b.txt (net diff, follow-ups)."

[[step]]
prompt = "change a.txt"

[[step]]
thinking = "Working out what to change."
ms = 1500

[[step]]
tool = "Write"
input = { file_path = "{cwd}/a.txt", content = "one\n" }
writes = [{ path = "{cwd}/a.txt", content = "one\n" }]
result = "File created successfully at: {cwd}/a.txt"
ms = 200

[[step]]
reply = "Changed a.txt."

[[step]]
idle = true

[[step]]
prompt = "continue"

[[step]]
thinking = "Working out what to change."
ms = 1500

[[step]]
tool = "Write"
input = { file_path = "{cwd}/a.txt", content = "one\ntwo\n" }
writes = [{ path = "{cwd}/a.txt", content = "one\ntwo\n" }]
result = "File created successfully at: {cwd}/a.txt"
ms = 200

[[step]]
reply = "Added a line."

[[step]]
idle = true

[[step]]
prompt = "ok"

[[step]]
thinking = "Working out what to change."
ms = 1500

[[step]]
tool = "Write"
input = { file_path = "{cwd}/b.txt", content = "bee\n" }
writes = [{ path = "{cwd}/b.txt", content = "bee\n" }]
result = "File created successfully at: {cwd}/b.txt"
ms = 200

[[step]]
reply = "Added b.txt."

[[step]]
idle = true
