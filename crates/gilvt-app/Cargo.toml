[package]
name = "gilvt-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "gilvt-app"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
gpui.workspace = true
# The same major version as gpui's: frames handed to `RenderImage`.
image = { version = "0.25", default-features = false }
imagesize = "0.13"
libc = "0.2"
notify = "8"
block2.workspace = true
objc2.workspace = true
# NSBundle (am I in Gilvt.app?), the userInfo of native notifications, and moving sessions to the Trash.
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSFileManager", "NSLocale", "NSString", "NSURL"] }
objc2-user-notifications = { workspace = true, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
# `NSEvent.modifierFlags`: ⌥ during drags from Finder; the Dock badge and bounce; `NSTextInputContext`: dropping an IME
# composition when the command bar closes under it (gpui never sends `discardMarkedText`).
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSDockTile", "NSEvent", "NSResponder", "NSTextInputContext"] }
# The NSView behind a gpui window (its window number for `gilvt debug state`); gpui's own version.
raw-window-handle = "0.6"
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
gilvt-agent.workspace = true
gilvt-config.workspace = true
gilvt-finder.workspace = true
gilvt-i18n.workspace = true
gilvt-ipc.workspace = true
gilvt-markdown.workspace = true
gilvt-mermaid.workspace = true
gilvt-monitor.workspace = true
gilvt-shell.workspace = true
gilvt-snapshot.workspace = true
gilvt-term.workspace = true
gilvt-theme.workspace = true
nucleo-matcher.workspace = true
gilvt-viewer.workspace = true
gilvt-editor.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true
# `TestAppContext` for the settings window's lifecycle tests.
gpui = { workspace = true, features = ["test-support"] }
