# Release workflow.
#
# Trigger: push a tag `vX.Y.Z`. Produces a signed, notarized, universal Gilvt-X.Y.Z.dmg on the GitHub
# Release and bumps the Homebrew cask.
#
# Secrets to create (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_CERT_P12_BASE64   base64 of the "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_CERT_PASSWORD     the .p12 password
#   DEVELOPER_ID_IDENTITY          e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY_P8_BASE64           base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID
#   TAP_GITHUB_TOKEN               fine-grained token with contents:write on the homebrew-gilvt tap repo
#                                  (the tap repo <owner>/homebrew-gilvt must exist before the first tag)
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain and both macOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Test
        run: cargo test --workspace --locked

      - name: Build, sign (hardened runtime) and package
        env:
          GILVT_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          GILVT_HARDENED: "1"
        run: scripts/package.sh

      - name: Notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" scripts/notarize.sh target/dist/Gilvt-*.dmg

      - name: Checksum
        run: |
          cd target/dist
          shasum -a 256 Gilvt-*.dmg | tee SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            target/dist/Gilvt-*.dmg
            target/dist/SHA256SUMS
          generate_release_notes: true

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(awk '{print $1}' target/dist/SHA256SUMS)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-gilvt.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${version}\"/" -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/gilvt.rb
          git config user.name "gilvt release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "gilvt ${version}"
          git push
