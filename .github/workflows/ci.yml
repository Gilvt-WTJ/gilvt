# Build and test, run by hand from the Actions tab (macOS minutes count 10x on private repos).
# GUI acceptance (tests/gui/) needs a desktop session and screen permissions, so it stays local.
name: ci
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
