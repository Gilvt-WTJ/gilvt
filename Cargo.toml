[workspace]
resolver = "2"
members = ["crates/gilvt-term", "crates/gilvt-shell", "crates/gilvt-ipc", "crates/gilvt-viewer", "crates/gilvt-markdown", "crates/gilvt-mermaid", "crates/gilvt-finder", "crates/gilvt-agent", "crates/gilvt-config", "crates/gilvt-cli", "crates/gilvt-app", "crates/gilvt-fake-agent", "crates/gilvt-snapshot", "crates/gilvt-editor", "crates/gilvt-monitor", "crates/gilvt-theme", "crates/gilvt-remote"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "Apache-2.0"
authors = ["Tongjue Wang <tjwangbusiness@gmail.com>"]
repository = "https://github.com/Gilvt-WTJ/gilvt"

[workspace.dependencies]
alacritty_terminal = "=0.26.0"
async-channel = "2.3"
block2 = "0.6"
comrak = { version = "0.55", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-web-kit = { version = "0.3", default-features = false }
objc2-user-notifications = { version = "0.3", default-features = false }
resvg = "=0.45.1"
ignore = "0.4"
nucleo-matcher = "0.3"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
gilvt-agent = { path = "crates/gilvt-agent" }
gilvt-config = { path = "crates/gilvt-config" }
gilvt-monitor = { path = "crates/gilvt-monitor" }
gilvt-finder = { path = "crates/gilvt-finder" }
gilvt-ipc = { path = "crates/gilvt-ipc" }
gilvt-shell = { path = "crates/gilvt-shell" }
gilvt-term = { path = "crates/gilvt-term" }
gilvt-theme = { path = "crates/gilvt-theme" }
gilvt-markdown = { path = "crates/gilvt-markdown" }
gilvt-mermaid = { path = "crates/gilvt-mermaid" }
gilvt-viewer = { path = "crates/gilvt-viewer" }
gilvt-snapshot = { path = "crates/gilvt-snapshot" }
gilvt-editor = { path = "crates/gilvt-editor" }

# Dependencies (syntect, fancy-regex, similar, gpui) are 10x slower unoptimized; optimize them
# in debug builds too. Workspace crates keep fast incremental debug builds.
[profile.dev.package."*"]
opt-level = 2

# gilvt-remote ships to ssh hosts (spec §10: small and static).
[profile.release-remote]
inherits = "release"
lto = true
strip = true
opt-level = "s"
codegen-units = 1
